# ==============================================================================
# ICICOS Agentic Hybrid RAG: Official Evaluation & Reproducibility Configuration
# Reconciled for Elsevier Knowledge-Based Systems (Q1) Publication Standards
# ==============================================================================

experiment:
  title: "Adaptive Agentic Hybrid RAG with BPMN-Grounded Graph Reasoning"
  manuscript_target: "Knowledge-Based Systems (Elsevier)"
  domain_scope: "Institutional Governance and Process Intelligence (ICICOS SOP & BPMN)"
  version: "2.0.0"
  git_commit_sha: "4defd04678f66ea64f674ea0bf107fc7f907edc3"
  sampling_seed: 42
  bootstrap_seed: 42

dataset:
  name: "ICICOS ProcessQA"
  canonical_json: "ICICOS_ProcessQA_Dataset/benchmark/icicos_process_qa.json"
  canonical_csv: "ICICOS_ProcessQA_Dataset/benchmark/icicos_process_qa.csv"
  total_queries: 338
  stratification:
    workflow: 108
    hybrid: 81
    decision_gateway: 80
    document_requirement: 69
  schema:
    - id
    - question
    - category
    - expected_source
    - expected_actor
    - expected_process
    - expected_answer
    - expected_bpmn_path

cohorts:
  primary_benchmark:
    sample_size: 70
    total_executions: 350
    manifest_csv: "ICICOS_ProcessQA_Dataset/cohorts/primary_n70.csv"
    stratification: { document_requirement: 18, workflow: 18, decision_gateway: 17, hybrid: 17 }
  procedural_diagnostic:
    sample_size: 60
    manifest_csv: "ICICOS_ProcessQA_Dataset/cohorts/procedural_n60.csv"
    disjoint_with_primary: true
    stratification: { workflow: 20, decision_gateway: 20, hybrid: 20 }
  ablation_diagnostic:
    sample_size: 20
    manifest_csv: "ICICOS_ProcessQA_Dataset/cohorts/ablation_n20.csv"
    stratification: { document_requirement: 5, workflow: 5, decision_gateway: 5, hybrid: 5 }
  cross_backbone_diagnostic:
    unique_queries: 7
    total_executions: 34
    manifest_csv: "ICICOS_ProcessQA_Dataset/cohorts/cross_backbone_evaluations_n34.csv"
    stratification: { document_requirement: 4, workflow: 1, decision_gateway: 1, hybrid: 1 }

models:
  primary_generation:
    provider: "Google AI Studio"
    model_name: "gemini-3.5-flash-lite"
    temperature: 0.0
    top_p: 1.0
    timeout_seconds: 60
    max_retries: 2
    seed_support: false
    system_instruction: "Zero-hallucination deterministic procedural question answering"
  
  cross_backbone:
    provider: "Groq Cloud API"
    model_name: "qwen/qwen3.8-27b"
    temperature: 0.0
    top_p: 1.0
    timeout_seconds: 60
    max_retries: 2

  critic_agent:
    provider: "Google AI Studio"
    model_name: "gemini-3.5-flash-lite"
    temperature: 0.0
    confidence_threshold: 0.85
    max_repair_iterations: 2
    dimensions:
      - "factual_grounding"
      - "domain_compliance"
      - "workflow_correctness"
      - "sop_correctness"
      - "answer_completeness"

  embeddings:
    provider: "sentence-transformers"
    model_name: "paraphrase-multilingual-MiniLM-L12-v2"
    embedding_dim: 384
    distance_metric: "cosine"

retrieval_budgets:
  llm_only:
    k_sop: 0
    k_bpmn: 0
    max_tokens: 0
    description: "Parametric zero-shot baseline without external context"
  
  vector_rag:
    k_sop: 6
    k_bpmn: 0
    retriever: "ChromaDB Dense Semantic Search"
    distance_metric: "cosine"
  
  graph_rag:
    k_sop: 0
    k_bpmn: 4
    retriever: "Directed BPMN 2-hop Subgraph Neighborhood Traversal"
    expansion_hops: 2
  
  static_hybrid:
    k_sop: 5
    k_bpmn: 3
    retriever: "Fixed Uniform Direct Concatenation"
    max_chunks: 8
  
  proposed_agentic:
    router_type: "Adaptive Gating Network (Intent-Conditioned Router)"
    max_total_chunks: 8
    dynamic_quotas:
      sop_dominant: { k_sop: 6, k_bpmn: 2 }
      bpmn_dominant: { k_sop: 3, k_bpmn: 4 }
      dual_hybrid: { k_sop: 5, k_bpmn: 3 }

evaluation_metrics:
  primary:
    - name: "Faithfulness"
      formulation: "Sentence-level premise entailment against retrieved context"
      range: [0.0, 1.0]
    - name: "Answer_Relevancy"
      formulation: "Intent keyword coverage and reverse query similarity"
      range: [0.0, 1.0]
    - name: "Context_Precision"
      formulation: "Mean Average Precision at rank k (MAP@k) for retrieved chunks"
      range: [0.0, 1.0]
    - name: "Context_Recall"
      formulation: "Ground-truth proposition coverage by retrieved context"
      range: [0.0, 1.0]
    - name: "SA-F1"
      formulation: "Semantic Agreement F1 using multilingual sentence embeddings"
      range: [0.0, 1.0]
  
  bpmn_procedural:
    - name: "Process_Path_Accuracy"
      abbreviation: "PPA"
      formulation: "0.6 * Milestone_Coverage + 0.4 * Monotonic_Order_Preservation"
      range: [0.0, 1.0]
    - name: "Gateway_Decision_Accuracy"
      abbreviation: "GDA"
      formulation: "XOR/OR conditional branch trigger identification and target resolution"
      threshold: 0.40
      range: [0.0, 1.0]
    - name: "Actor_Attribution_Accuracy"
      abbreviation: "AAA"
      formulation: "Swimlane organizational role assignment fidelity"
      range: [0.0, 1.0]

statistical_validation:
  unit_of_analysis: "query-level paired comparison"
  primary_sample_size: 70
  primary_degrees_of_freedom: 69
  normality_test: "Shapiro-Wilk (alpha = 0.05)"
  parametric_test: "Paired Student's t-test (two-tailed)"
  non_parametric_test: "Wilcoxon signed-rank test (two-tailed)"
  bootstrap_resamples: 10000
  bootstrap_seed: 42
  effect_size: "Cohen's d_z (paired formulation)"
  confidence_interval: "95% CI"
